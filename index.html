<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel de Cargas - Canção Alimentos</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
  :root{
    --bg:#0f1420; --panel:#161d2e; --panel2:#1c2438; --border:#2a3450;
    --text:#e8ecf5; --muted:#8b95ad; --accent:#3b82f6;
    --s1:#64748b; --s2:#eab308; --s3:#3b82f6; --s4:#22c55e;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg); color:var(--text); padding:24px;
  }
  h1{font-size:22px; margin:0 0 4px;}
  .sub{color:var(--muted); font-size:13px; margin-bottom:20px;}
  .toolbar{
    display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:18px;
  }
  .toolbar input[type=text]{
    background:var(--panel2); border:1px solid var(--border); color:var(--text);
    padding:8px 12px; border-radius:8px; font-size:13px; min-width:220px;
  }
  .toolbar select{
    background:var(--panel2); border:1px solid var(--border); color:var(--text);
    padding:8px 12px; border-radius:8px; font-size:13px;
  }
  .stats{display:flex; gap:10px; margin-left:auto; flex-wrap:wrap;}
  .stat{
    background:var(--panel2); border:1px solid var(--border); border-radius:8px;
    padding:8px 14px; font-size:12px; color:var(--muted); text-align:center;
  }
  .stat b{display:block; font-size:16px; color:var(--text);}
  .grid{display:flex; flex-direction:column; gap:14px;}
  .card{
    background:var(--panel); border:1px solid var(--border); border-radius:12px;
    overflow:hidden;
  }
  .card-head{
    display:flex; justify-content:space-between; align-items:center;
    padding:14px 18px; cursor:pointer; gap:12px; flex-wrap:wrap;
  }
  .card-head:hover{background:rgba(255,255,255,0.02);}
  .head-left{display:flex; flex-direction:column; gap:2px;}
  .viagem-id{font-size:15px; font-weight:600;}
  .head-meta{font-size:12px; color:var(--muted);}
  .head-right{display:flex; align-items:center; gap:16px; flex-wrap:wrap;}
  .totals{font-size:12px; color:var(--muted); text-align:right;}
  .totals b{color:var(--text);}
  .status-track{display:flex; gap:4px;}
  .status-btn{
    display:flex; align-items:center; gap:6px;
    border:1px solid var(--border); background:var(--panel2); color:var(--muted);
    font-size:11px; padding:6px 10px; border-radius:6px; cursor:pointer;
    white-space:nowrap; transition:all .15s;
  }
  .status-btn:hover{border-color:var(--accent);}
  .status-btn .dot{
    width:14px; height:14px; border-radius:4px; border:1px solid var(--border);
    display:flex; align-items:center; justify-content:center; flex:none;
    font-size:10px; background:var(--bg);
  }
  .status-btn.on-1{border-color:var(--s1);} .status-btn.on-1 .dot{background:var(--s1); border-color:var(--s1); color:#fff;}
  .status-btn.on-2{border-color:var(--s2);} .status-btn.on-2 .dot{background:var(--s2); border-color:var(--s2); color:#1a1400;}
  .status-btn.on-3{border-color:var(--s3);} .status-btn.on-3 .dot{background:var(--s3); border-color:var(--s3); color:#fff;}
  .status-btn.on-4{border-color:var(--s4);} .status-btn.on-4 .dot{background:var(--s4); border-color:var(--s4); color:#04220f;}
  .lock-icon{font-size:10px; color:var(--muted); margin-right:2px;}
  .chev{color:var(--muted); font-size:13px; margin-left:4px;}
  .admin-bar{display:flex; align-items:center; gap:8px; font-size:12px; color:var(--muted);}
  .admin-bar button{
    background:var(--panel2); border:1px solid var(--border); color:var(--text);
    padding:6px 12px; border-radius:8px; font-size:12px; cursor:pointer;
  }
  .admin-bar button:hover{border-color:var(--accent);}
  .admin-on{color:var(--s4) !important; font-weight:600;}
  .sync-bar{
    display:flex; align-items:center; gap:8px; font-size:12px; margin-bottom:16px;
    padding:8px 12px; border-radius:8px; border:1px solid var(--border);
  }
  .sync-bar .dot-status{width:8px; height:8px; border-radius:50%; flex:none;}
  .sync-ok{background:rgba(34,197,94,0.08);} .sync-ok .dot-status{background:var(--s4);}
  .sync-off{background:rgba(234,179,8,0.08);} .sync-off .dot-status{background:var(--s2);}
  .sync-err{background:rgba(239,68,68,0.08);} .sync-err .dot-status{background:#ef4444;}
  .card-body{display:none; border-top:1px solid var(--border);}
  .card-body.open{display:block;}
  .pedido{border-bottom:1px solid var(--border); padding:12px 18px;}
  .pedido:last-child{border-bottom:none;}
  .pedido-head{
    display:flex; justify-content:space-between; align-items:baseline; gap:10px;
    cursor:pointer; flex-wrap:wrap;
  }
  .pedido-cliente{font-size:13.5px; font-weight:600;}
  .pedido-cidade{font-size:12px; color:var(--muted); font-weight:400; margin-left:6px;}
  .pedido-tot{font-size:12px; color:var(--muted); white-space:nowrap;}
  .pedido-obs{font-size:11.5px; color:#f2b93a; margin-top:4px; font-style:italic;}
  .itens{display:none; margin-top:10px;}
  .itens.open{display:block;}
  table{width:100%; border-collapse:collapse; font-size:12.5px;}
  th{
    text-align:left; color:var(--muted); font-weight:500; font-size:11px;
    padding:4px 8px; border-bottom:1px solid var(--border);
    text-transform:uppercase; letter-spacing:.03em;
  }
  td{padding:5px 8px; border-bottom:1px solid rgba(255,255,255,0.04);}
  td.num{text-align:right; white-space:nowrap; font-variant-numeric:tabular-nums;}
  .codigo{color:var(--muted); font-size:11px;}
  .footer-note{
    margin-top:26px; font-size:11.5px; color:var(--muted); line-height:1.6;
    border-top:1px solid var(--border); padding-top:14px;
  }
  .badge{
    font-size:10px; padding:2px 7px; border-radius:20px; border:1px solid var(--border);
    color:var(--muted);
  }
  .brand-bar{display:flex; align-items:center; gap:14px; margin-bottom:18px;}
  .brand-bar img{height:44px; width:auto; display:block;}
  .brand-bar .logo-box{
    background:#fff; padding:8px 14px; border-radius:8px; display:flex; align-items:center;
  }
  .brand-bar .titles h1{margin:0;}
  .brand-bar .titles .sub{margin-bottom:0;}
  .empty{padding:30px; text-align:center; color:var(--muted);}

  @media (max-width: 640px){
    body{padding:14px;}
    .brand-bar{margin-bottom:14px;}
    .brand-bar img{height:34px;}
    h1{font-size:18px;}
    .sub{font-size:12px;}
    .toolbar{gap:8px;}
    .toolbar input[type=text]{min-width:0; width:100%;}
    .toolbar select{width:100%;}
    .stats{width:100%; margin-left:0; justify-content:space-between;}
    .stat{flex:1 1 auto; padding:6px 8px;}
    .card-head{flex-direction:column; align-items:stretch; padding:12px;}
    .head-right{width:100%; align-items:stretch;}
    .totals{text-align:left; margin-bottom:6px;}
    .status-track{flex-wrap:wrap; width:100%; gap:6px;}
    .status-btn{flex:1 1 calc(50% - 6px); justify-content:center; padding:8px 6px; font-size:11px;}
    .pedido{padding:10px 12px;}
    table{font-size:11.5px;}
    th, td{padding:4px 5px;}
  }
</style>
</head>

// ATENÇÃO: isto é apenas uma trava de uso (evita cliques acidentais/curiosos),
// não é segurança real — qualquer pessoa que veja o código-fonte vê a senha.
// Troque a senha abaixo antes de publicar, e se precisar de segurança de
// verdade, isso precisa ficar atrás de login no servidor que for hospedar.
const ADMIN_PASSWORD = "cancao2026";
const ADMIN_KEY = "cargas_admin_v1";

function isAdmin(){
  return sessionStorage.getItem(ADMIN_KEY) === "1";
}
function tryEnterAdmin(){
  const pass = prompt("Senha de administrador para alterar status:");
  if(pass === null) return false;
  if(pass === ADMIN_PASSWORD){
    sessionStorage.setItem(ADMIN_KEY, "1");
    return true;
  }
  alert("Senha incorreta.");
  return false;
}
function updateAdminBar(){
  const label = document.getElementById('adminState');
  const btn = document.getElementById('adminToggle');
  if(isAdmin()){
    label.textContent = "Modo admin (pode alterar status)";
    label.className = "admin-on";
    btn.textContent = "Sair do modo admin";
  } else {
    label.textContent = "Modo consulta (somente leitura)";
    label.className = "";
    btn.textContent = "Entrar como admin";
  }
}
document.getElementById('adminToggle').onclick = ()=>{
  if(isAdmin()){
    sessionStorage.removeItem(ADMIN_KEY);
    updateAdminBar();
  } else {
    if(tryEnterAdmin()) updateAdminBar();
  }
};

// ---- sincronização em tempo real (Firebase Realtime Database) ----
// 1) Crie um projeto grátis em https://console.firebase.google.com
// 2) Ative "Realtime Database" (modo teste já serve para começar)
// 3) Nas regras do banco, use algo como:
//      { "rules": { "cargas": { ".read": true, ".write": true } } }
// 4) Cole as credenciais do seu projeto (Configurações do projeto > Config do SDK) abaixo:
const firebaseConfig = {
  apiKey: "AIzaSyCaGPA0eWn8cbLV3TMGRZJs1xfzPXjBjVw",
  authDomain: "status-cargas-varejo.firebaseapp.com",
  databaseURL: "https://status-cargas-varejo-default-rtdb.firebaseio.com",
  projectId: "status-cargas-varejo"
};

const FIREBASE_CONFIGURADO = firebaseConfig.apiKey !== "COLE_SUA_API_KEY_AQUI";

const STAGE_LABELS = ["Veículo chegou na planta","Separado","Carregado","Faturado"];
// statusMap[viagemNumero] = {1:bool,2:bool,3:bool,4:bool} -- 4 etapas independentes,
// não sequenciais (ex.: carga pode estar "Separada" antes do veículo chegar na planta)
let statusMap = {};
let dbRef = null;

function setSyncBar(state, text){
  const bar = document.getElementById('syncBar');
  bar.className = 'sync-bar ' + state;
  document.getElementById('syncText').textContent = text;
}

// Enquanto o Firebase não é configurado, ou se ele falhar, o painel funciona
// em modo local (armazenamento só neste navegador) para não travar o uso.
const LOCAL_KEY = "cargas_status_v2";
function loadLocal(){
  try{return JSON.parse(localStorage.getItem(LOCAL_KEY)||"{}");}catch(e){return {};}
}
function saveLocal(s){
  localStorage.setItem(LOCAL_KEY, JSON.stringify(s));
}

function iniciarSync(){
  if(!FIREBASE_CONFIGURADO){
    statusMap = loadLocal();
    setSyncBar('sync-off', 'Atualização em tempo real não configurada — usando apenas este navegador. Veja as instruções no código-fonte (const firebaseConfig).');
    render();
    return;
  }
  try{
    firebase.initializeApp(firebaseConfig);
    dbRef = firebase.database().ref('cargas');
    dbRef.on('value', (snapshot)=>{
      statusMap = snapshot.val() || {};
      setSyncBar('sync-ok', 'Conectado — status sincronizado em tempo real para todos que abrirem este link.');
      render();
    }, (err)=>{
      console.error(err);
      setSyncBar('sync-err', 'Erro ao conectar à atualização em tempo real. Verifique a configuração do Firebase.');
    });
  }catch(e){
    console.error(e);
    statusMap = loadLocal();
    setSyncBar('sync-err', 'Falha ao iniciar a atualização em tempo real — usando apenas este navegador.');
    render();
  }
}

function setEtapa(numero, n, valor){
  if(FIREBASE_CONFIGURADO && dbRef){
    dbRef.child(numero).child(n).set(valor);
  } else {
    if(!statusMap[numero]) statusMap[numero] = {};
    statusMap[numero][n] = valor;
    saveLocal(statusMap);
    render();
  }
}

function fmt(n){
  return Number(n).toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1});
}

function pedidoTotais(p){
  let cx=0,kg=0;
  p.itens.forEach(it=>{cx+=it[2]; kg+=it[3];});
  return {cx,kg};
}

function render(){
  const grid = document.getElementById('grid');
  grid.innerHTML = "";
  const busca = document.getElementById('busca').value.trim().toLowerCase();
  const filtroStatus = document.getElementById('filtroStatus').value;

  let visiveis = 0;
  const contagem = [0,0,0,0]; // quantas cargas têm a etapa N marcada (independente das outras)
  viagens.forEach(v=>{
    const st = statusMap[v.numero] || {};
    for(let n=1;n<=4;n++){ if(st[n]) contagem[n-1]++; }
  });

  viagens.forEach(v=>{
    const st = statusMap[v.numero] || {};
    const matchesStatus = !filtroStatus || !!st[filtroStatus];
    const haystack = (v.numero+" "+v.transportadora+" "+v.motorista+" "+
      v.pedidos.map(p=>p.cliente+" "+p.cidade).join(" ")).toLowerCase();
    const matchesBusca = !busca || haystack.includes(busca);
    if(!matchesStatus || !matchesBusca) return;
    visiveis++;

    const card = document.createElement('div');
    card.className = 'card';

    const head = document.createElement('div');
    head.className = 'card-head';
    head.innerHTML = `
      <div class="head-left">
        <div class="viagem-id">Viagem ${v.numero} <span class="chev">&#9662;</span></div>
        <div class="head-meta">${v.transportadora} &middot; ${v.motorista} &middot; ${v.data} ${v.hora} &middot; <span class="badge">${v.entregas} entregas</span></div>
      </div>
      <div class="head-right">
        <div class="totals"><b>${fmt(v.totalCx)}</b> cx / <b>${fmt(v.totalKg)}</b> kg</div>
        <div class="status-track" data-viagem="${v.numero}"></div>
      </div>`;

    const track = head.querySelector('.status-track');
    STAGE_LABELS.forEach((label, idx)=>{
      const n = idx+1;
      const checked = !!st[n];
      const btn = document.createElement('button');
      btn.className = 'status-btn' + (checked ? ' on-'+n : '');
      btn.innerHTML = `<span class="dot">${checked ? '&#10003;' : ''}</span>${!isAdmin() ? '<span class="lock-icon">&#128274;</span>' : ''}${label}`;
      btn.title = isAdmin() ? "Clique para marcar/desmarcar" : "Requer login de admin para alterar";
      btn.onclick = (ev)=>{
        ev.stopPropagation();
        if(!isAdmin()){
          if(!tryEnterAdmin()) return;
          updateAdminBar();
        }
        setEtapa(v.numero, n, !checked);
      };
      track.appendChild(btn);
    });

    const body = document.createElement('div');
    body.className = 'card-body';

    v.pedidos.forEach((p, pi)=>{
      const tot = pedidoTotais(p);
      const pedidoEl = document.createElement('div');
      pedidoEl.className = 'pedido';
      pedidoEl.innerHTML = `
        <div class="pedido-head">
          <div><span class="pedido-cliente">${p.codigo ? p.codigo+' - ' : ''}${p.cliente}</span><span class="pedido-cidade">${p.cidade}</span></div>
          <div class="pedido-tot">${fmt(tot.cx)} cx / ${fmt(tot.kg)} kg</div>
        </div>
        ${p.obs ? `<div class="pedido-obs">&#9888; ${p.obs}</div>` : ''}
        <div class="itens">
          <table>
            <thead><tr><th>Código</th><th>Produto</th><th>CX</th><th>KG</th></tr></thead>
            <tbody>
              ${p.itens.map(it=>`<tr><td class="codigo">${it[0]}</td><td>${it[1]}</td><td class="num">${fmt(it[2])}</td><td class="num">${fmt(it[3])}</td></tr>`).join('')}
            </tbody>
          </table>
        </div>`;
      const ph = pedidoEl.querySelector('.pedido-head');
      const itensEl = pedidoEl.querySelector('.itens');
      ph.onclick = ()=> itensEl.classList.toggle('open');
      body.appendChild(pedidoEl);
    });

    head.onclick = ()=> body.classList.toggle('open');
    card.appendChild(head);
    card.appendChild(body);
    grid.appendChild(card);
  });

  if(visiveis===0){
    grid.innerHTML = '<div class="empty">Nenhuma carga encontrada com esse filtro.</div>';
  }

  const stats = document.getElementById('stats');
  const total = viagens.length;
  stats.innerHTML = `
    <div class="stat"><b>${total}</b>Total de cargas</div>
    <div class="stat"><b>${contagem[0]}</b>Na planta</div>
    <div class="stat"><b>${contagem[1]}</b>Separado</div>
    <div class="stat"><b>${contagem[2]}</b>Carregado</div>
    <div class="stat"><b>${contagem[3]}</b>Faturado</div>
  `;
  updateAdminBar();
}

document.getElementById('busca').addEventListener('input', render);
document.getElementById('filtroStatus').addEventListener('change', render);
iniciarSync();
</script>
